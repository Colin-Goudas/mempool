
<div [class.full-container]="!widget">
  <ng-container *ngIf="!error">
    <div [class]="!widget ? 'chart' : 'chart-widget'" *browserOnly [style]="{ height: widget ? ((height + 20) + 'px') : null, paddingBottom: !widget && !allowZoom ? '10px' : null}" echarts [initOpts]="chartInitOptions" [options]="chartOptions"
      (chartInit)="onChartInit($event)">
    </div>
    <div class="text-center loadingGraphs" *ngIf="isLoading">
      <div class="spinner-border text-light" aria-hidden="true"></div><p role="status">Loading balance history…</p>
    </div>
  </ng-container>
  <ng-container *ngIf="error">
    <div class="error-wrapper">
      <p class="error" role="status">{{ error }}</p><button type="button" class="btn btn-outline-info" (click)="retryHistory()">Try again</button>
    </div>
  </ng-container>


</div>
